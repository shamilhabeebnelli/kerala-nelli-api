name: build-api-data
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build json endpoints
        run: python scripts/build_api.py
      - name: commit updated data
        run: |
          git config user.name "denelli-api bot"
          git config user.email "ceo@denelli.in"
          git add api/
          git diff --cached --quiet && echo "no data change" || git commit -m "chore: refresh api data"
          git push
