<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="kd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#kd-bg)"/>
  <!-- sun with rays -->
  <g stroke="#fde047" stroke-width="3.5" stroke-linecap="round">
    <line x1="36" y1="14" x2="36" y2="21"/>
    <line x1="20" y1="20" x2="25" y2="25"/>
    <line x1="14" y1="36" x2="21" y2="36"/>
    <line x1="20" y1="52" x2="25" y2="47"/>
    <line x1="52" y1="20" x2="47" y2="25"/>
  </g>
  <circle cx="36" cy="36" r="11" fill="#fde047"/>
  <!-- cloud -->
  <path d="M34 66 a11 11 0 0 1 -1.5 -21.9 a14 14 0 0 1 27 -3.2 a10 10 0 0 1 9.5 10.1 a10 10 0 0 1 -10 10 z"
        transform="translate(6,4)" fill="#ffffff"/>
  <!-- N on cloud -->
  <text x="54" y="69" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0284c7" text-anchor="middle">N</text>
  <!-- rain drops -->
  <g stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round">
    <line x1="42" y1="80" x2="40" y2="86"/>
    <line x1="54" y1="80" x2="52" y2="86"/>
    <line x1="66" y1="80" x2="64" y2="86"/>
  </g>
</svg>
